<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>One Night Werewolf</title>
    <style>
        /* ===== CSS Variables & Themes ===== */
        :root {
            --bg-panel: rgba(255, 255, 255, 0.92);
            --text-color: #2c3e50;
            --panel-border: rgba(255,255,255,0.6);
            --hud-bg: rgba(255, 255, 255, 0.95);
            --hud-border: #2c3e50;
            --card-shadow: rgba(0,0,0,0.3);
            --btn-primary: #3498db;
            --chat-bg: rgba(255,255,255,0.8);
        }
        body.dark-mode {
            --bg-panel: rgba(30, 35, 45, 0.92);
            --text-color: #e0e0e0;
            --panel-border: rgba(60, 70, 90, 0.6);
            --hud-bg: rgba(30, 35, 45, 0.95);
            --hud-border: #7f8c8d;
            --card-shadow: rgba(0,0,0,0.5);
            --btn-primary: #2980b9;
            --chat-bg: rgba(30, 35, 45, 0.8);
        }

        /* ===== Animations ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardFlip {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(255,215,0,0.3); }
            50% { box-shadow: 0 0 20px rgba(255,215,0,0.6); }
        }
        @keyframes voteReveal {
            from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        .slide-up { animation: slideUp 0.6s ease forwards; }
        .card-flip { animation: cardFlip 0.8s ease forwards; }
        .pulse { animation: pulse 1.5s ease infinite; }
        .glow { animation: glow 2s ease infinite; }
        .vote-reveal { animation: voteReveal 0.6s ease forwards; }

        /* ===== Video Background ===== */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        /* ===== Base ===== */
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            color: var(--text-color);
            transition: color 0.3s, background-color 0.3s;
        }

        #setup, #gameArea {
            background: var(--bg-panel);
            padding: 25px;
            border-radius: 12px;
            max-width: 650px;
            margin: 20px auto;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            transition: background 0.3s, border 0.3s;
        }

        /* ===== Cards ===== */
        .role-card-img {
            display: block;
            width: 120px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin: 10px auto;
            box-shadow: 0 4px 6px var(--card-shadow);
            transition: box-shadow 0.3s;
        }
        .role-card-img.flippable {
            cursor: pointer;
        }
        .role-card-img.flipped {
            animation: cardFlip 0.8s ease;
        }

        /* ===== HUD ===== */
        #fixedRoleHUD {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--hud-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--hud-border);
            z-index: 9999;
            display: none;
            width: 110px;
            text-align: center;
            transition: background 0.3s, border 0.3s;
        }
        #fixedRoleHUD strong { font-size: 14px; display: block; margin-bottom: 2px; }
        #fixedRoleHUD small { font-size: 11px; color: #555; font-weight: bold; }
        body.dark-mode #fixedRoleHUD small { color: #aaa; }

        /* ===== Buttons ===== */
        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .night-btn {
            display: block;
            margin: 8px auto;
            background-color: #2c3e50;
            color: white;
            width: 80%;
        }
        .swipe-btn {
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ===== Inputs ===== */
        input[type="text"], input[type="number"], select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-right: 5px;
            background: var(--bg-panel);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s, border 0.3s;
        }
        body.dark-mode input[type="text"],
        body.dark-mode input[type="number"],
        body.dark-mode select {
            background: #2c3e50;
            color: #e0e0e0;
            border-color: #555;
        }

        /* ===== Chat ===== */
        #chatBox {
            margin-top: 15px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
            display: none;
        }
        #chatMessages {
            max-height: 150px;
            overflow-y: auto;
            background: var(--chat-bg);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            transition: background 0.3s;
        }
        #chatMessages div {
            padding: 3px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            animation: fadeIn 0.3s ease;
        }
        #chatInputRow {
            display: flex;
            gap: 5px;
        }
        #chatInputRow input { flex: 1; }
        #chatInputRow button { flex-shrink: 0; }

        /* ===== (removed spectator badge) ===== */

        /* ===== Stats & Achievements ===== */
        #statsPanel {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: var(--bg-panel);
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            transition: background 0.3s;
        }
        #statsPanel table { width: 100%; border-collapse: collapse; }
        #statsPanel td, #statsPanel th { padding: 6px 8px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-gold { background: #f1c40f; color: #333; }
        .badge-silver { background: #bdc3c7; color: #333; }
        .badge-bronze { background: #e67e22; color: white; }

        /* ===== Night replay ===== */
        #nightReplay {
            margin-top: 15px;
            padding: 10px;
            background: var(--chat-bg);
            border-radius: 8px;
            display: none;
            font-size: 13px;
            transition: background 0.3s;
        }
        #nightReplay div { padding: 4px 0; animation: fadeIn 0.4s ease; }

        /* ===== Misc ===== */
        #displayCode { word-break: break-word; }
        .vote-status { transition: all 0.3s; }
        .emoji-picker-btn { font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .emoji-picker-btn:hover { background: rgba(0,0,0,0.05); }

        /* ===== Mobile swipe hint ===== */
        .swipe-hint {
            font-size: 11px;
            color: #7f8c8d;
            text-align: center;
            margin-top: 4px;
        }

        /* ===== Toolbar ===== */
        #toolbar {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            z-index: 10000;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        #toolbar button {
            font-size: 12px;
            padding: 5px 8px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #toolbar button:hover { opacity: 0.85; }

        /* ===== (removed spectator toggle) ===== */
    </style>
</head>
<body class="dark-mode">

    <video id="bgVideo" autoplay muted loop playsinline>
        <source src="images/background_lobby.mp4" type="video/mp4">
    </video>

    <div id="setup">
        <h2>🐺 One Night Werewolf</h2>
        <input type="text" id="playerName" placeholder="Enter Name">
        <input type="text" id="gameCode" placeholder="Game Code">
        <br><br>
        <button style="background-color: #34495e; color: white;" onclick="createGame()">Create Game</button>
        <button style="background-color: #27ae60; color: white;" onclick="joinGame()">Join Game</button>
    </div>

    <div id="gameArea" style="display:none;">
        <h3 id="displayCode"></h3>
        
        <button id="startButton" style="display:none; background-color: #e74c3c; color: white; font-size: 16px;" onclick="startGame()">Start Game</button>

        <div id="playerList">
            <h4>Players in Lobby:</h4>
            <ul id="playersUl" style="list-style-type: '👤 '; padding-left: 20px;"></ul>
        </div>

        <hr style="border: 0; height: 1px; background: #ccc; margin: 20px 0;">
        <div id="statusArea"></div> 
        <div id="actionArea" style="margin-top: 15px;"></div>

        <!-- Chat -->
        <div id="chatBox">
            <strong style="font-size:13px;">💬 Day Chat</strong>
            <div id="chatMessages"></div>
            <div id="chatInputRow">
                <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()" style="background:#3498db;color:white;">Send</button>
            </div>
        </div>

        <!-- Night replay (shown at gameover) -->
        <div id="nightReplay"><strong>🌙 Night Actions Log</strong><div id="nightReplayLog"></div></div>

        <!-- Stats & Achievements panel -->
        <div id="statsPanel">
            <h4 style="margin:0 0 10px 0;">📊 Player Stats & Achievements</h4>
            <div id="statsContent"></div>
        </div>
    </div>

    <div id="fixedRoleHUD"></div>

    <!-- Toolbar -->
    <div id="toolbar">
        <button id="soundToggle" onclick="soundEnabled=!soundEnabled;this.innerText=soundEnabled?'🔔 SFX':'🔕 SFX';">🔔 SFX</button>
        <button id="musicToggle" onclick="toggleMusic()">🎵 Music ON</button>
        <button id="darkModeToggle" onclick="toggleDarkMode()">☀️ Light</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
